<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>নোয়াপাড়া বাজার - Payment SMS</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,'Noto Sans Bengali',sans-serif;background:#f3f5f7;margin:0;padding:18px;color:#18212b}
main{max-width:560px;margin:auto;background:white;padding:20px;border-radius:16px;box-shadow:0 4px 18px #0001}
h2{text-align:center;margin:0 0 5px;color:#14532d}p.sub{text-align:center;color:#64748b;margin:0 0 20px}
label{display:block;font-weight:600;margin:13px 0 6px}input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;background:white}
.monthrow{display:flex;gap:8px}.monthrow select{flex:1}.monthrow button{width:auto}
button{border:0;border-radius:9px;padding:12px 16px;font-size:15px;font-weight:700;background:#166534;color:white;cursor:pointer}
.months{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.chip{background:#e2e8f0;color:#1e293b;padding:7px 10px;border-radius:20px;font-size:14px}
.chip button{background:transparent;color:#991b1b;padding:0 0 0 7px}
.preview{white-space:pre-wrap;background:#f8fafc;border:1px solid #cbd5e1;border-radius:10px;padding:14px;min-height:130px;margin-top:8px}
.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1}.secondary{background:#1d4ed8}.print{background:#475569}
.month-item{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#e2e8f0;color:#1e293b;padding:7px 10px;border-radius:12px;font-size:14px}.month-item .amount{width:112px;padding:7px 9px;font-size:15px;margin:0}.month-item .month-name{font-weight:600}
#printReceipt{display:none}
@media print{
  @page{size:auto;margin:10mm}
  body{background:#fff;padding:0;color:#111}
  body>*{display:none!important}
  #printReceipt{display:block!important;max-width:320px;margin:0 auto;padding:14px 12px;font-family:system-ui,'Noto Sans Bengali',sans-serif;color:#111}
  #printReceipt .receipt-head{text-align:center;border-bottom:1px dashed #555;padding-bottom:10px;margin-bottom:10px}
  #printReceipt h2{font-size:19px;margin:0 0 3px;color:#111}
  #printReceipt .receipt-sub{font-size:12px;margin:0;color:#333}
  #printReceipt .receipt-title{text-align:center;font-weight:700;font-size:15px;margin:10px 0}
  #printReceipt .receipt-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin:6px 0}
  #printReceipt .receipt-label{color:#333}
  #printReceipt .receipt-months{border-top:1px dashed #777;border-bottom:1px dashed #777;padding:8px 0;margin:10px 0}
  #printReceipt .receipt-month{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:3px 0}
  #printReceipt .receipt-total{font-weight:700;font-size:15px;border-top:1px solid #333;padding-top:8px;margin-top:8px}
  #printReceipt .receipt-foot{text-align:center;font-size:11px;margin-top:14px;border-top:1px dashed #777;padding-top:9px}
}
</style>
</head>
<body><main>
<h2>নোয়াপাড়া বাজার</h2><p class="sub">Payment SMS Maker</p>
<label>দোকানদারের নাম</label><input id="name" placeholder="নাম লিখুন">
<label>ব্যবসার ধরন</label><input id="business" placeholder="যেমন: মুদি দোকান">
<label>বিল আইডি</label><input id="bill" placeholder="বিল আইডি লিখুন">
<label>বকেয়া মাস যোগ করুন</label>
<div class="monthrow"><select id="month">
<option value="">মাস নির্বাচন করুন</option>
<option>জানুয়ারি</option><option>ফেব্রুয়ারি</option><option>মার্চ</option><option>এপ্রিল</option>
<option>মে</option><option>জুন</option><option>জুলাই</option><option>আগস্ট</option>
<option>সেপ্টেম্বর</option><option>অক্টোবর</option><option>নভেম্বর</option><option>ডিসেম্বর</option>
</select><button type="button" onclick="addMonth()">যোগ করুন</button></div>
<div class="months" id="months"></div>
<label>তারিখ</label><input id="date" type="date">
<label>SMS Preview</label><div class="preview" id="preview"></div>
<div class="actions"><button onclick="copySms()">Copy</button><button class="secondary" onclick="shareSms()">Share</button><button class="print" onclick="printSms()">Print</button></div>
</main>
<section id="printReceipt" aria-hidden="true"></section>
<script>
const selected=[];
const amounts={};
const $=id=>document.getElementById(id);
function addMonth(){const m=$('month').value;if(m&&!selected.includes(m)){selected.push(m);renderMonths();update();}$('month').value='';}
function removeMonth(m){const i=selected.indexOf(m);if(i>-1)selected.splice(i,1);delete amounts[m];renderMonths();update();}
function renderMonths(){$('months').innerHTML='';selected.forEach(m=>{const s=document.createElement('div');s.className='month-item';const label=document.createElement('span');label.className='month-name';label.textContent=m+' — ৳';const amount=document.createElement('input');amount.className='amount';amount.type='number';amount.min='0';amount.step='0.01';amount.inputMode='decimal';amount.placeholder='টাকার পরিমাণ';amount.setAttribute('aria-label',m+' মাসের টাকার পরিমাণ');amount.value=amounts[m]??'';amount.addEventListener('input',()=>{amounts[m]=amount.value;update();});const b=document.createElement('button');b.type='button';b.textContent='×';b.setAttribute('aria-label',m+' বাদ দিন');b.onclick=()=>removeMonth(m);s.append(label,amount,b);$('months').appendChild(s);});}
function sms(){const date=$('date').value;const niceDate=date?new Date(date+'T00:00:00').toLocaleDateString('bn-BD'):'';
return ['নোয়াপাড়া বাজার','দোকানদারের নাম: '+$('name').value,'ব্যবসার ধরন: '+$('business').value,'বিল আইডি: '+$('bill').value,'বকেয়া মাস: '+(selected.map(m=>m+' ৳ '+(amounts[m]||'টাকা দেওয়া হয়নি')).join(', ')||'উল্লেখ নেই'),'তারিখ: '+niceDate,'ধন্যবাদ।'].join('\n');}
function update(){$('preview').textContent=sms();}
['name','business','bill','date'].forEach(id=>$(id).addEventListener('input',update));
function copySms(){const t=sms();if(window.AndroidBridge)AndroidBridge.copyText(t);else navigator.clipboard.writeText(t).then(()=>alert('কপি হয়েছে'));}
function shareSms(){const t=sms();if(window.AndroidBridge)AndroidBridge.shareText(t);else if(navigator.share)navigator.share({text:t});else alert('এই ব্রাউজারে Share সুবিধা নেই');}
function receiptText(){
 const date=$('date').value;
 const niceDate=date?new Date(date+'T00:00:00').toLocaleDateString('bn-BD'):'উল্লেখ নেই';
 const rows=selected.map(m=>'  '+m+' : ৳ '+(amounts[m]||'টাকা দেওয়া হয়নি'));
 const total=selected.reduce((sum,m)=>sum+(Number(amounts[m])||0),0);
 return [
  '       নোয়াপাড়া বাজার',
  '       বিল/পেমেন্ট বিবরণ',
  '--------------------------------',
  'দোকানদার: '+($('name').value||'উল্লেখ নেই'),
  'ব্যবসার ধরন: '+($('business').value||'উল্লেখ নেই'),
  'বিল আইডি: '+($('bill').value||'উল্লেখ নেই'),
  'তারিখ: '+niceDate,
  '--------------------------------',
  'মাসভিত্তিক টাকার পরিমাণ:',
  ...(rows.length?rows:['  কোনো মাস যোগ করা হয়নি']),
  '--------------------------------',
  'মোট: ৳ '+total.toLocaleString('bn-BD'),
  '',
  '       ধন্যবাদ',
  '       নোয়াপাড়া বাজার'
 ].join('\n');
}
function printSms(){
 const date=$('date').value;
 const niceDate=date?new Date(date+'T00:00:00').toLocaleDateString('bn-BD'):'উল্লেখ নেই';
 const total=selected.reduce((sum,m)=>sum+(Number(amounts[m])||0),0);
 const receipt=$('printReceipt');
 const monthRows=selected.map(m=>'<div class="receipt-month"><span>'+escapeHtml(m)+'</span><strong>৳ '+escapeHtml(amounts[m]||'—')+'</strong></div>').join('');
 receipt.innerHTML=
  '<div class="receipt-head"><h2>নোয়াপাড়া বাজার</h2><p class="receipt-sub">বিল/পেমেন্ট বিবরণ</p></div>'+
  '<div class="receipt-row"><span class="receipt-label">দোকানদার</span><strong>'+escapeHtml($('name').value||'উল্লেখ নেই')+'</strong></div>'+
  '<div class="receipt-row"><span class="receipt-label">ব্যবসার ধরন</span><span>'+escapeHtml($('business').value||'উল্লেখ নেই')+'</span></div>'+
  '<div class="receipt-row"><span class="receipt-label">বিল আইডি</span><span>'+escapeHtml($('bill').value||'উল্লেখ নেই')+'</span></div>'+
  '<div class="receipt-row"><span class="receipt-label">তারিখ</span><span>'+escapeHtml(niceDate)+'</span></div>'+
  '<div class="receipt-months">'+(monthRows||'<div class="receipt-month">কোনো মাস যোগ করা হয়নি</div>')+'</div>'+
  '<div class="receipt-row receipt-total"><span>মোট</span><strong>৳ '+total.toLocaleString('bn-BD')+'</strong></div>'+
  '<div class="receipt-foot">ধন্যবাদ<br>নোয়াপাড়া বাজার</div>';
 if(window.AndroidBridge) AndroidBridge.printText(receiptText());
 else window.print();
}
function escapeHtml(value){
 return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
update();
</script></body></html>
